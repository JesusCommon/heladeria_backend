[project]
name = "heladeria-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JesusCommon", email = "Jesuscommon@outlook.com" }
]
requires-python = ">=3.13.17"
dependencies = [
    "beanie>=2.2.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
heladeria-backend = "heladeria_backend:main"

[build-system]

[project]
name = "heladeria-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JesusCommon", email = "Jesuscommon@outlook.com" }
]
requires-python = ">=3.13.17"
dependencies = [
    "beanie>=2.2.0",
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
heladeria-backend = "heladeria_backend:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests que requieren MongoDB real",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]
